<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mística Natural · Gestión</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f0f8f5;--sf:#fff;--ink:#212021;--mu:#5c6d66;--ln:#d3e6de;--ac:#1c9764;--ac2:#fff;--te:#87d1d4;--wa:#1b5f63;--wb:#d9f1f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a16;--sf:#17251f;--ink:#e8f1ec;--mu:#93a99f;--ln:#2a3d34;--ac:#3fc88a;--ac2:#0b1a13;--wa:#87d1d4;--wb:#1d3a3c}}
:root[data-theme="dark"]{--bg:#0f1a16;--sf:#17251f;--ink:#e8f1ec;--mu:#93a99f;--ln:#2a3d34;--ac:#3fc88a;--ac2:#0b1a13;--wa:#87d1d4;--wb:#1d3a3c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap;background:var(--sf);border-bottom:3px solid var(--te)}
header img{height:42px;background:#fff;border-radius:6px;padding:2px 6px}
h3{margin:14px 0 6px;font:600 17px Georgia,serif}.mu,small{color:var(--mu);font-size:12px}.w{color:#b4571a}
.op{margin-left:auto;font-size:13px;background:var(--wb);color:var(--wa);padding:5px 12px;border-radius:99px}
.qt{flex:1;min-width:180px;font:italic 13px/1.3 Georgia,serif;color:var(--mu)}
.op{margin-left:0!important}
nav{display:flex;gap:4px;padding:6px 12px;border-bottom:1px solid var(--ln);overflow-x:auto;background:var(--sf)}
nav button{border:0;background:none;color:var(--mu);font:inherit;padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--ac);color:var(--ac2)}
main{max-width:1000px;margin:0 auto;padding:14px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:14px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:9px}
input[type=checkbox]{width:auto}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:8px}
.row{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--ln);width:100%;background:none;border-width:0 0 1px;color:var(--ink);font:inherit;text-align:left;flex-wrap:wrap}
button.row{cursor:pointer}button.row:hover,.lk:hover{background:var(--bg)}.row .n{flex:1;min-width:130px}.row small{display:block}
.lk{cursor:pointer;color:var(--ac);text-decoration:underline;background:none;border:0;font:inherit;padding:0}
.b{background:var(--ac);color:var(--ac2);border:0;border-radius:8px;padding:9px 14px;font:600 14px inherit;cursor:pointer}
.b.s{background:none;color:var(--ac);border:1px solid var(--ln);padding:5px 10px;font-weight:500;font-size:13px}
.q{width:28px;height:28px;border-radius:50%;border:1px solid var(--ln);background:var(--sf);color:var(--ink);cursor:pointer}
.tot{display:flex;justify-content:space-between;font:600 20px Georgia,serif;margin:8px 0}
.chip{display:inline-block;background:var(--wb);color:var(--wa);padding:4px 10px;border-radius:99px;margin:0 6px 6px 0;font-size:13px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.k div{background:var(--bg);border-radius:8px;padding:8px}.k b{display:block;font:600 18px Georgia,serif}
.ln{display:grid;grid-template-columns:1fr 70px 90px 60px 90px 28px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--ln)}
@media(max-width:620px){.ln{grid-template-columns:1fr 60px 80px 50px 28px}.ln .st{grid-column:1/-1;text-align:right}}
#md{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}
#md>div{background:var(--sf);border-radius:12px;padding:16px;width:100%;max-width:460px;max-height:88vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;display:none;z-index:10}
[hidden]{display:none!important}
</style></head><body>
