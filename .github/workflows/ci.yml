name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  base-de-datos:
    name: Base de datos (migraciones y aislamiento)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar migraciones
        run: scripts/db-migrar.sh
      - name: Las migraciones son idempotentes (segunda corrida no cambia nada)
        run: scripts/db-migrar.sh
      - name: Tests de base de datos
        run: scripts/db-test.sh

  seguridad:
    name: Seguridad (contraseñas, sesiones, permisos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  panel:
    name: Aplicación (tipos, compilación y migraciones)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/panel
    env:
      DATABASE_URL_LOCAL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Tipos (TypeScript estricto)
        run: ../../scripts/ci-anotar.sh Tipos npm run typecheck
      - name: Compilar
        run: ../../scripts/ci-anotar.sh Compilar npm run build
      - name: Aplicar migraciones con el aplicador de la app (dos veces)
        run: |
          ../../scripts/ci-anotar.sh Migrar-1 node scripts/migrar.mjs
          ../../scripts/ci-anotar.sh Migrar-2 node scripts/migrar.mjs
      - name: Tests de ingreso, sesiones, límite de intentos y aislamiento
        run: ../../scripts/ci-anotar.sh Tests-de-ingreso npm test
      - name: Tests de base de datos sobre lo aplicado por la app
        working-directory: .
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: scripts/db-test.sh
